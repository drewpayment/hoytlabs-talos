# Intentionally has no selector, so it never gets endpoints. The HTTPRoute
# sends POST /auth/register here to close public signup at the gateway; Envoy
# answers 503 "no healthy upstream" and FastAPI never sees the request. See the
# REGISTRATION_ENABLED comment in configmap.yaml for why the app's own flag
# cannot be used for this.
apiVersion: v1
kind: Service
metadata:
  name: surfsense-deny
  namespace: surfsense
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
