# Two storage tiers on purpose, which is a deliberate break from the
# static-NFS-PV pattern the other apps in this repo use:
#
#   openebs-hostpath (local disk, RWO, node-pinned)
#     - Postgres. pgvector index maintenance plus zero-cache continuously
#       draining a logical replication slot is a far heavier IO profile than
#       mission-control or sprinkler put on their databases, and NFS is the
#       wrong floor for it.
#     - zero-cache's replica file, which is SQLite. SQLite over NFS is a
#       documented corruption risk, not a performance preference.
#
#   nfs-csi-isolated (dynamic, RWX, on the TrueNAS box, one directory per claim)
#     - The object store and scratch dir, which the backend and the Celery
#       worker both mount and therefore genuinely need ReadWriteMany.
#     - Redis, which is only a Celery broker here; its AOF is replayable state,
#       not a system of record.
#
# The two hostpath claims pin their pods to whichever node binds first. For a
# single-replica homelab stack that is the right trade; the cost is that losing
# that node means restoring Postgres from backup rather than rescheduling.
#
# MIGRATION (see docs/plans/2026-10-10-nfs-csi-isolation.md)
#   The three surfsense-*-pvc claims below use the deprecated nfs-csi class,
#   which mounts one shared NAS directory for every claim. They stay in place
#   until the cutover is verified: they are the rollback target, and ArgoCD
#   prunes anything removed from git. The -v2 claims are the isolated
#   replacements. Consumers switch to them in the cutover commit, not here.
#   storageClassName is immutable, so a new name is the only in-place option.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-postgres-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 20Gi
---
# DEPRECATED (nfs-csi, shared directory). Rollback target until cutover is verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-object-store-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 50Gi
---
# DEPRECATED (nfs-csi, shared directory). Rollback target until cutover is verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-shared-tmp-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 20Gi
---
# DEPRECATED (nfs-csi, shared directory). Rollback target until cutover is verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-redis-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
# Isolated replacements. Provisioned now (empty); not mounted by anything until
# the cutover commit. Directories: /mnt/tank/appdata/surfsense/<claim-name>.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-object-store-v2-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi-isolated
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-shared-tmp-v2-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi-isolated
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-redis-v2-pvc
  namespace: surfsense
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi-isolated
  resources:
    requests:
      storage: 5Gi
