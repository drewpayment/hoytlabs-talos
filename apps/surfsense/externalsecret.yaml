apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surfsense-secret
  namespace: surfsense
  annotations:
    # Ahead of everything: every pod below mounts keys from the Secret this
    # produces, and a pod scheduled before it exists sits in ContainerCreating.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: surfsense-secret
  data:
    # Keep this password alphanumeric. It is interpolated into DATABASE_URL and
    # the three ZERO_*_DB URLs as a bare substring, with no percent-encoding
    # step anywhere in the chain, so a '@', ':' or '/' in it produces a URL that
    # parses into the wrong host and fails in a way that does not name the cause.
    - secretKey: postgres_user
      remoteRef:
        key: SS_POSTGRES_USER
    - secretKey: postgres_password
      remoteRef:
        key: SS_POSTGRES_PASSWORD
    # openssl rand -base64 32. Signs session cookies: rotating it logs everyone out.
    - secretKey: secret_key
      remoteRef:
        key: SS_SECRET_KEY
    - secretKey: zero_admin_password
      remoteRef:
        key: SS_ZERO_ADMIN_PASSWORD
    - secretKey: searxng_secret
      remoteRef:
        key: SS_SEARXNG_SECRET
