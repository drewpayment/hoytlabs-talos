apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surfsense-secret
  namespace: surfsense
  annotations:
    # Ahead of everything: every pod below mounts keys from the Secret this
    # produces, and a pod scheduled before it exists sits in ContainerCreating.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: surfsense-secret
  data:
    # Keep this password alphanumeric. It is interpolated into DATABASE_URL and
    # the three ZERO_*_DB URLs as a bare substring, with no percent-encoding
    # step anywhere in the chain, so a '@', ':' or '/' in it produces a URL that
    # parses into the wrong host and fails in a way that does not name the cause.
    - secretKey: postgres_user
      remoteRef:
        key: SS_POSTGRES_USER
    - secretKey: postgres_password
      remoteRef:
        key: SS_POSTGRES_PASSWORD
    # openssl rand -base64 32. Signs session cookies: rotating it logs everyone out.
    - secretKey: secret_key
      remoteRef:
        key: SS_SECRET_KEY
    - secretKey: zero_admin_password
      remoteRef:
        key: SS_ZERO_ADMIN_PASSWORD
    - secretKey: searxng_secret
      remoteRef:
        key: SS_SEARXNG_SECRET
    # GitHub App used by the git-native knowledge store to push a workspace's
    # repository to a repo the user owns (Workspace Settings -> Connected repo).
    # Registered under the user's GitHub account with Contents: read & write
    # and Setup URL /api/v1/workspaces/git-remotes/github/callback. The
    # private key is the multi-line PEM GitHub generates once; the backend
    # also accepts literal "\n" in place of newlines.
    - secretKey: github_app_id
      remoteRef:
        key: SS_GITHUB_APP_ID
    - secretKey: github_app_slug
      remoteRef:
        key: SS_GITHUB_APP_SLUG
    - secretKey: github_app_private_key
      remoteRef:
        key: SS_GITHUB_APP_PRIVATE_KEY
    # For the minknotes sync CronJob only. The GitHub PAT needs repo read on
    # drewpayment/minknotes; the SurfSense token is a personal access token
    # created in the web app (ss_pat_ prefix) with document-create rights in
    # the workspace.
    - secretKey: minknotes_github_pat
      remoteRef:
        key: SS_GITHUB_PAT
    - secretKey: surfsense_api_token
      remoteRef:
        key: SS_TOKEN
