# Provisions atlas's database prerequisites, runs drizzle migrations, then the
# idempotent seed - on every ArgoCD sync. Safe to re-run: db:ensure converges
# rather than recreating, migrations are versioned, and the seed is
# check-then-skip (it looks for the admin user by email and does nothing if
# found) - NOT upsert. Rotating ADMIN_PASSWORD in Doppler and letting this Job
# re-run will NOT change the existing admin's password; that requires a manual
# update, not a resync.
#
# PreSync, NOT PostSync (which is what sprinkler-bootstrap uses, and what this
# used until it deadlocked in the 2026-08-30 recovery):
#
# ArgoCD will not start PostSync hooks until every sync-phase resource reports
# healthy. atlas-web only becomes healthy once it can reach its database - and
# after the shared Postgres lost its data directory, atlas's role no longer
# existed, so it never could. The Job that recreates the role was the PostSync
# hook, which was waiting on the Deployment, which was waiting on the role.
# The sync sat at "waiting for healthy state of apps/Deployment/atlas-web"
# indefinitely and the self-healing provisioning never got to run.
#
# PreSync inverts that: the database is made ready *before* the new pods roll,
# so the very scenario db:ensure exists for is one it can actually recover.
# It also means a failed migration aborts the sync before any new pod is
# rolled out, rather than after.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-bootstrap
  namespace: atlas
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: atlas-bootstrap
    spec:
      serviceAccountName: atlas
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: ghcr.io/drewpayment/atlas-bootstrap:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: DATABASE_URL
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: ADMIN_PASSWORD
            # Postgres server superuser, for the db:ensure step only - it
            # creates atlas's role/database when they're missing and keeps the
            # role password in step with DATABASE_URL. Scoped to this Job on
            # purpose: the web pod is internet-facing and has no reason to
            # hold a credential that can create roles. Optional so the Job
            # still runs (and just skips provisioning) if the keys are absent.
            - name: ATLAS_DB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: ATLAS_DB_ADMIN_USER
                  optional: true
            - name: ATLAS_DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: ATLAS_DB_ADMIN_PASSWORD
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
