# App-owned StorageClass for atlas-db, distinct from the cluster-default
# `openebs-hostpath` SC (infrastructure/storage/openebs/) which is
# reclaimPolicy: Delete. Combined with this app's prune: true ArgoCD sync
# policy, a pruned/recreated Cluster CR on Delete-reclaim storage would
# silently destroy the database's PV. Retain here means a deleted PVC/PV
# leaves the underlying hostpath data on disk for manual recovery instead.
#
# Same provisioner/annotation shape as openebs-hostpath (openebs.io/local,
# same BasePath) - only reclaimPolicy differs. Mirrors the app-owned
# StorageClass convention other apps use for NFS (e.g. sprinkler-storage,
# orbit-storage), applied to local-disk storage instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: atlas-db-storage
  annotations:
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/openebs/local"
    openebs.io/cas-type: local
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
