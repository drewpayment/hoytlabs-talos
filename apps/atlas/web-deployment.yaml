apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
  namespace: atlas
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: atlas-web
  template:
    metadata:
      labels:
        app: atlas-web
    spec:
      serviceAccountName: atlas
      containers:
        - name: web
          image: ghcr.io/drewpayment/atlas-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: BETTER_AUTH_URL
            - name: TRUSTED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: TRUSTED_ORIGINS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: uri
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: BETTER_AUTH_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
