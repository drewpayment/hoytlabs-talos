apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
  namespace: atlas
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: atlas-web
  template:
    metadata:
      labels:
        app: atlas-web
      annotations:
        # Env comes from atlas-config/atlas-secret by reference, and Kubernetes
        # only reads those at container start - editing the ConfigMap/Secret
        # alone leaves running pods on the old values. Bump this whenever a
        # mail-related value changes so ArgoCD's sync actually rolls the pod.
        hoytlabs.app/mail-config-rev: "resend-support-hoytlabs-app-3"
    spec:
      serviceAccountName: atlas
      containers:
        - name: web
          image: ghcr.io/drewpayment/atlas-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: BETTER_AUTH_URL
            - name: TRUSTED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: TRUSTED_ORIGINS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: NODE_ENV
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: TRUSTED_PROXIES
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: BETTER_AUTH_SECRET
            # M5 mail transport - see configmap.yaml for the resend turn-on
            # checklist. The API key is optional so the pod schedules while the
            # driver is `console` and the Doppler key doesn't exist yet; once
            # the driver flips to `resend` the app fails loudly per send (and
            # logs the reason) if the key is still missing, rather than at
            # startup.
            - name: ATLAS_EMAIL_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: ATLAS_EMAIL_DRIVER
            - name: ATLAS_EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: atlas-config
                  key: ATLAS_EMAIL_FROM
            - name: ATLAS_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlas-secret
                  key: ATLAS_RESEND_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # DB-free path on purpose: /api/health does `select 1` against
          # Postgres, and with a single-instance CNPG cluster a DB blip would
          # otherwise get kubelet to kill+restart the web pod into a
          # CrashLoopBackOff that outlives the outage. /login renders without
          # touching the DB (unauthenticated GET, excluded from the auth
          # proxy) and returns 200 as long as the Next.js server itself is
          # alive - the actual thing liveness should be checking. Same reason
          # sprinkler's liveness probes /sign-in instead of a DB-backed route.
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
