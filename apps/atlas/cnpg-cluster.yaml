# CloudNativePG Cluster. Requires the CNPG operator (and its CRDs) to be
# installed first via infrastructure/controllers/cloudnative-pg/.
#
# CRD-ordering, corrected: the sync-wave annotations (-2 on infra, 1 on
# apps) live on the two ApplicationSet objects themselves, NOT on the
# generated per-directory Applications - ApplicationSets don't propagate
# sync-wave to what they generate, so nothing actually orders the
# "cloudnative-pg" Application before the "atlas" Application. And
# ServerSideApply does NOT tolerate an unknown GVK: a Cluster CR applied
# before the CRD exists is hard-rejected, not deferred.
#
# What actually makes this converge instead of wedging: selfHeal: true on
# the apps ApplicationSet's syncPolicy keeps re-driving the atlas
# Application's sync until it succeeds. Each retry re-applies the same
# desired state, so once the cloudnative-pg Application has installed the
# CRDs and the operator pod is Ready (its ValidatingWebhookConfiguration is
# failurePolicy: Fail, backed by a self-signed cert the operator patches in
# at startup - so the webhook itself gates until the operator is actually
# up, not just CRD-Established), a subsequent selfHeal pass applies cleanly.
# Convergence is minutes, not a permanent failure, and prune can't destroy
# a Cluster that was never successfully created. SkipDryRunOnMissingResource
# below quiets the noisy "no matches for kind Cluster" dry-run errors on the
# syncs before that point.
#
# Explicit database/owner (not the chart default "app"/"app") so the
# generated connection semantics are obvious to the app engineer:
#   - Secret:  atlas-db-app  (auto-created by CNPG)
#   - Key:     uri            -> postgresql://atlas:<password>@atlas-db-rw:5432/atlas
#   - Host:    atlas-db-rw    (CNPG read-write Service, DNS-resolvable in-namespace)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atlas-db
  namespace: atlas
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10

  bootstrap:
    initdb:
      database: atlas
      owner: atlas

  storage:
    size: 2Gi
    storageClass: atlas-db-storage

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
