apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
resources:
  # Core
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  # Application services
  - bootstrap-job.yaml
  - web-deployment.yaml
  - web-svc.yaml
  # Scheduled work (30-day trash retention)
  - purge-trash-cronjob.yaml
  # Networking
  - http-route.yaml

# Release pinning (GitOps deploy): bump newTag to the atlas merge commit SHA
# after CI pushes images. The tag change is what makes ArgoCD roll the
# deployment and re-run the PostSync bootstrap (migrate+seed) Job.
#
# Always the FULL 40-char SHA - short SHAs won't resolve, since CI tags
# images with the full ${{ github.sha }}.
images:
  - name: ghcr.io/drewpayment/atlas-web
    newTag: 41015f1f2dc53e667752299f653b02a83bef0f1c
  - name: ghcr.io/drewpayment/atlas-bootstrap
    newTag: 41015f1f2dc53e667752299f653b02a83bef0f1c
