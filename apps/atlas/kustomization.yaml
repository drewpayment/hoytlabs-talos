apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
resources:
  # Core
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  # Atlas's own PostgreSQL (CloudNativePG, 2 instances); wave 0
  # StorageClass is cluster-scoped; it is applied with the app, but not namespaced
  - db-storageclass.yaml
  - cnpg-cluster.yaml
  - db-backup-storageclass.yaml  # cluster-scoped; per-claim NFS dirs for db backups
  # Application services
  - bootstrap-job.yaml
  - web-deployment.yaml
  - web-svc.yaml
  # Scheduled work
  - purge-trash-cronjob.yaml   # 30-day trash retention
  - db-backup-pvc.yaml         # NAS-backed volume for database dumps
  - db-backup-cronjob.yaml     # nightly pg_dump, 30-day retention
  - db-backup-watchdog-cronjob.yaml  # 09:00 check of last night's dump; emails on failure
  # Networking
  - http-route.yaml

# Release pinning (GitOps deploy): bump newTag to the atlas merge commit SHA
# after CI pushes images. The tag change is what makes ArgoCD roll the
# deployment and re-run the bootstrap (migrate+seed) Sync hook.
#
# Always the FULL 40-char SHA - short SHAs won't resolve, since CI tags
# images with the full ${{ github.sha }}.
images:
  - name: ghcr.io/drewpayment/atlas-web
    newTag: f23b3af5fd677f147150427e01585c52abed6af6
  - name: ghcr.io/drewpayment/atlas-bootstrap
    newTag: f23b3af5fd677f147150427e01585c52abed6af6
