apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-secret
  namespace: atlas
spec:
  # 15m (was 1h): a rotated Doppler value should land within minutes, not an
  # hour - the ATLAS_RESEND_API_KEY rotation sat invisible behind the 1h
  # window. Note rotating a value still needs a pod roll (bump the
  # mail-config-rev annotation in web-deployment.yaml): env is read from the
  # secret only at container start.
  refreshInterval: "15m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: atlas-secret
  data:
    # Points at the shared lab Postgres (postgresql.orbit.svc.cluster.local),
    # which already hosts orbit/temporal/kafka_service. See the note at the
    # bottom of this file for why this isn't CloudNativePG.
    - secretKey: DATABASE_URL
      remoteRef:
        key: ATLAS_DATABASE_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: ATLAS_BETTER_AUTH_SECRET
    # Consumed only by the bootstrap Job's idempotent seed (initial admin user).
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: ATLAS_ADMIN_EMAIL
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: ATLAS_ADMIN_PASSWORD
    # Static bearer token for POST /api/cron/purge-trash, checked in constant
    # time by the app (src/lib/cron-auth.ts) - no session/cookie on that route.
    # Consumed by the atlas-purge-trash CronJob; the app rejects a token that
    # is unset or too short, so this must exist for nightly purges to run.
    - secretKey: CRON_SECRET
      remoteRef:
        key: ATLAS_CRON_SECRET
    # M5 mail (atlas PR #2): Resend API key for the transactional mail the app
    # sends (email verification + password reset). Scoped in Resend to the
    # support.hoytlabs.app sending domain - see configmap.yaml.
    - secretKey: ATLAS_RESEND_API_KEY
      remoteRef:
        key: ATLAS_RESEND_API_KEY
    # atlas PR #3: read-write token for the *private* Vercel Blob store that
    # holds images pasted onto a diagram canvas. The store's access mode is
    # fixed at creation and must stay private - a public store would hand out
    # permanent unauthenticated blob URLs and bypass the app's own share
    # permissions, so an image from a private diagram would stay fetchable by
    # anyone who ever saw the URL even after the share link was revoked.
    #
    # Not Vercel's OIDC pair (BLOB_STORE_ID + VERCEL_OIDC_TOKEN): OIDC only
    # authenticates workloads running on Vercel, and atlas runs here.
    #
    # Optional in web-deployment.yaml on purpose - unset just means the app
    # keeps embedding images in the scene JSON as it did before, so a missing
    # key degrades the feature instead of breaking the pod.
    - secretKey: ATLAS_BLOB_READ_WRITE_TOKEN
      remoteRef:
        key: ATLAS_BLOB_READ_WRITE_TOKEN
    # Postgres *server* superuser - consumed ONLY by the bootstrap Job (see
    # bootstrap-job.yaml; deliberately absent from web-deployment.yaml), which
    # uses it to create atlas's own role and database if they don't exist.
    #
    # Deliberately the same Doppler keys the Postgres server itself is
    # initialized from (apps/orbit/externalsecret.yaml maps the identical pair
    # into orbit-secrets as POSTGRES_USER/POSTGRES_PASSWORD) rather than a
    # second copy of that password to drift out of sync.
    #
    # Why the Job needs this at all: atlas's role and database were originally
    # created by hand and described nowhere in git, so when the shared server
    # lost its data directory they were simply gone - DATABASE_URL stayed
    # valid while the account it named no longer existed, and recovery took
    # hand-run SQL. atlas PR #4 made those prerequisites declarative
    # (scripts/ensure-db.ts, first step of db:bootstrap); this is the
    # credential that lets it re-assert them on every sync. The script issues
    # no DROP and refuses to touch orbit/temporal/kafka_service.
    - secretKey: ATLAS_DB_ADMIN_USER
      remoteRef:
        key: ORBIT_POSTGRES_USER
    - secretKey: ATLAS_DB_ADMIN_PASSWORD
      remoteRef:
        key: ORBIT_POSTGRES_PASSWORD
  # NOTE on DATABASE_URL: atlas originally ran its own CloudNativePG cluster,
  # which took DATABASE_URL from CNPG's generated `atlas-db-app` Secret. That
  # never came up: CNPG's PVC couldn't mount because Talos runs kubelet
  # containerized without /var/openebs/local in its mount set, so the kubelet
  # can't see directories the openebs local-hostpath provisioner creates on the
  # node. atlas-db-1 was the first PVC in this cluster to ever use an openebs
  # StorageClass, which is why nothing had hit it before. Rather than change
  # every node's machine config for one app, atlas now uses the existing shared
  # Postgres in the orbit namespace (PG 15; migrations and the full test suite
  # verified against 15 before the switch).
