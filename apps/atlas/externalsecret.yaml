apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-secret
  namespace: atlas
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: atlas-secret
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: ATLAS_BETTER_AUTH_SECRET
    # Consumed only by the bootstrap Job's idempotent seed (initial admin user).
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: ATLAS_ADMIN_EMAIL
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: ATLAS_ADMIN_PASSWORD
    # Static bearer token for POST /api/cron/purge-trash, checked in constant
    # time by the app (src/lib/cron-auth.ts) - no session/cookie on that route.
    # Consumed by the atlas-purge-trash CronJob; the app rejects a token that
    # is unset or too short, so this must exist for nightly purges to run.
    - secretKey: CRON_SECRET
      remoteRef:
        key: ATLAS_CRON_SECRET
  # NOTE: DATABASE_URL is intentionally NOT sourced from Doppler here.
  # CloudNativePG generates it in the auto-created `atlas-db-app` Secret
  # (key `uri`) - see cnpg-cluster.yaml and web-deployment.yaml/bootstrap-job.yaml.
