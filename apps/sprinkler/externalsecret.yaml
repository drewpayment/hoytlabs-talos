apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sprinkler-secret
  namespace: sprinkler
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: sprinkler-secret
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: SPRINKLER_POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: SPRINKLER_POSTGRES_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: SPRINKLER_DATABASE_URL
    - secretKey: RAINBIRD_PASSWORD
      remoteRef:
        key: SPRINKLER_RAINBIRD_PASSWORD
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: SPRINKLER_BETTER_AUTH_SECRET
    # Consumed only by the bootstrap Job's idempotent seed (initial admin user).
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: SPRINKLER_ADMIN_EMAIL
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: SPRINKLER_ADMIN_PASSWORD
