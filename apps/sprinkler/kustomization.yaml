apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sprinkler
resources:
  # Core
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  # Data layer
  - pvc.yaml
  - postgres-deployment.yaml
  - postgres-svc.yaml
  # Application services
  - bootstrap-job.yaml
  - api-deployment.yaml
  - api-svc.yaml
  - web-deployment.yaml
  - web-svc.yaml
  # Networking
  - http-route.yaml
  # Node prerequisite for reaching the Rain Bird module
  - arp-pinner.yaml
