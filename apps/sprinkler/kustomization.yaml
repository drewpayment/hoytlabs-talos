apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sprinkler
resources:
  # Core
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  # Data layer
  - pvc.yaml
  - postgres-deployment.yaml
  - postgres-svc.yaml
  # Application services
  - bootstrap-job.yaml
  - api-deployment.yaml
  - api-svc.yaml
  - web-deployment.yaml
  - web-svc.yaml
  # Networking
  - http-route.yaml
  # Node prerequisite for reaching the Rain Bird module
  - arp-pinner.yaml

# Release pinning (GitOps deploy): bump newTag to the sprinklergoose merge
# commit SHA after CI pushes images. The tag change is what makes ArgoCD
# roll the deployments and re-run the PostSync bootstrap (migrate+seed) Job.
images:
  - name: ghcr.io/drewpayment/sprinklergoose-api
    newTag: a2a54853bd21ba1a3b31f00e82fe4b4575a5544b
  - name: ghcr.io/drewpayment/sprinklergoose-web
    newTag: a2a54853bd21ba1a3b31f00e82fe4b4575a5544b
  - name: ghcr.io/drewpayment/sprinklergoose-bootstrap
    newTag: a2a54853bd21ba1a3b31f00e82fe4b4575a5544b
