# The Rain Bird LNK WiFi module NEVER answers broadcast ARP (deep power-save),
# so any node that may route executor traffic to it needs a permanent neighbor
# entry. Re-pinned every 60s to survive neighbor-table flushes and reboots.
# The interface is auto-derived from the kernel route to the module (Talos
# nodes here use ens18/bond0, not eth0); set IFACE to override.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arp-pinner
  namespace: sprinkler
  labels:
    app: arp-pinner
spec:
  selector:
    matchLabels:
      app: arp-pinner
  template:
    metadata:
      labels:
        app: arp-pinner
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists # every node, control-plane included
      containers:
        - name: arp-pinner
          # alpine, not busybox: busybox's ip applet lacks `neigh`
          image: alpine:3.20
          env:
            - name: IFACE
              value: "" # empty = auto-detect from route to RAINBIRD_IP
            - name: RAINBIRD_IP
              value: "192.168.86.173"
            - name: RAINBIRD_MAC
              value: "4c:a1:61:01:05:15"
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache iproute2 >/dev/null
              while true; do
                dev="${IFACE:-$(ip -o route get "$RAINBIRD_IP" | sed -n 's/.* dev \([^ ]*\).*/\1/p')}"
                if [ -n "$dev" ]; then
                  ip neigh replace "$RAINBIRD_IP" lladdr "$RAINBIRD_MAC" dev "$dev" nud permanent \
                    && echo "pinned $RAINBIRD_IP -> $RAINBIRD_MAC on $dev" \
                    || echo "ERROR: pin failed on dev=$dev"
                else
                  echo "ERROR: no route device found for $RAINBIRD_IP"
                fi
                sleep 60
              done
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
