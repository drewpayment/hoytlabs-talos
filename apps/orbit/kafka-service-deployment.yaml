apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-service
  template:
    metadata:
      labels:
        app: kafka-service
    spec:
      serviceAccountName: orbit
      containers:
        - name: kafka-service
          image: ghcr.io/drewpayment/orbit/kafka-service:latest
          ports:
            - name: grpc
              containerPort: 50055
          env:
            - name: GRPC_PORT
              value: "50055"
            - name: ENVIRONMENT
              value: production
            # Required (>=32 bytes) — service exits at startup without it.
            - name: ORBIT_SVC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: ORBIT_SVC_AUTH_SECRET
            - name: ORBIT_SVC_AUTH_ENFORCE
              value: "true"
            # Postgres is required — the service runs its own migrations in the
            # kafka_service database (created by the postgresql init script).
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: POSTGRES_USER
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(PG_USER):$(PG_PASS)@postgresql:5432/kafka_service?sslmode=disable"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 5
            periodSeconds: 10
