apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: buildkit
spec:
  selector:
    matchLabels:
      app: buildkit
  template:
    metadata:
      labels:
        app: buildkit
    spec:
      serviceAccountName: orbit
      # Share one PID namespace across the pod so a buildkitd left behind by a
      # previous container instance is still visible (and killable) from the
      # next one. Without this, a leaked daemon holds buildkitd.lock and the
      # :1234 listener forever and every restart dies with "could not lock
      # /var/lib/buildkit/buildkitd.lock, another instance running?" until the
      # pod itself is recreated (seen on kube-master-msi-1, 11k+ restarts).
      shareProcessNamespace: true
      containers:
        - name: buildkit
          image: moby/buildkit:v0.17.3
          command: ["sh", "-c"]
          args:
            - |
              # Reap any buildkitd that outlived its container (see
              # shareProcessNamespace above), then start fresh.
              if pkill -x buildkitd; then
                echo "buildkit: killed a stale buildkitd from a previous container"
                sleep 2
                pkill -9 -x buildkitd || true
              fi
              exec buildkitd --addr tcp://0.0.0.0:1234
          ports:
            - containerPort: 1234
          # Only route build-service traffic to a daemon that is actually
          # listening, and restart one that stops answering.
          readinessProbe:
            tcpSocket:
              port: 1234
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1234
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            privileged: true
          volumeMounts:
            - name: cache
              mountPath: /var/lib/buildkit
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: "2"
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
