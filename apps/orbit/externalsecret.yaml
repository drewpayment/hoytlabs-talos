apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orbit-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster-secret-store
  target:
    name: orbit-secrets
  data:
    # Postgres superuser. The same Doppler pair is mapped into
    # atlas/atlas-secret as ATLAS_DB_ADMIN_USER / ATLAS_DB_ADMIN_PASSWORD so
    # atlas's bootstrap Job can (re)create its own role and database.
    - secretKey: POSTGRES_USER
      remoteRef: { key: ORBIT_POSTGRES_USER }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: ORBIT_POSTGRES_PASSWORD }
