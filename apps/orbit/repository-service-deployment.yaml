apiVersion: apps/v1
kind: Deployment
metadata:
  name: repository-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repository-service
  template:
    metadata:
      labels:
        app: repository-service
    spec:
      serviceAccountName: orbit
      containers:
        - name: repository-service
          image: ghcr.io/drewpayment/orbit/repository-service:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8081
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "8081"
            - name: TEMPORAL_HOST
              value: temporal:7233
            - name: TEMPLATE_WORK_DIR
              value: /tmp/orbit-templates
            # Required (>=32 bytes) — service exits at startup without it.
            - name: ORBIT_SVC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: orbit-secrets
                  key: ORBIT_SVC_AUTH_SECRET
            - name: ORBIT_SVC_AUTH_ENFORCE
              value: "true"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
